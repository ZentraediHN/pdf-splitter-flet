name: Build Windows Portable Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Portable with PyInstaller
      run: |
        pyinstaller --onefile --name "PDFSplitter" --collect-all flet --collect-all flet_desktop pdf-splitter-flet_V.0.3.7.py

    - name: Upload Portable Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFSplitter-Portable
        path: dist/PDFSplitter.exe
