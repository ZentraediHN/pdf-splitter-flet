name: Build Windows Installer (Setup.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller (Fixed for Flet)
      run: |
        pyinstaller --noconsole --onedir --name "PDFSplitter" --collect-all flet --collect-all flet_desktop pdf-splitter-flet_V.0.3.7.py

    - name: Compile Inno Setup Script
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
      with:
        path: installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFSplitter-Windows-Installer
        path: installer_output/PDFSplitter_Installer_v0.3.7.exe
